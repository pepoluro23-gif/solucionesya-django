{% extends 'base.html' %}
{% block title %}Registrarse{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3">Crear cuenta</h1>
      <form method="post">{% csrf_token %}
        {% include 'accounts/_form_campos.html' %}
        <button class="btn btn-primary w-100" type="submit">Registrarme</button>
      </form>
      <p class="mt-3 mb-0 small">¿Ya tenés cuenta? <a href="{% url 'accounts:login' %}">Ingresá</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
