{% extends 'base.html' %}
{% block title %}Borrar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body">
        <h1 class="h4">¿Borrar "{{ servicio.titulo }}"?</h1>
        <p class="text-muted">Esta acción no se puede deshacer.</p>
        <form method="post">{% csrf_token %}
          <button class="btn btn-danger" type="submit">Sí, borrar</button>
          <a href="{{ servicio.get_absolute_url }}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
